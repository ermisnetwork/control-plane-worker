name = "test-control-plane-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-18"

[build]
command = "cargo install -q worker-build@^0.7 && worker-build --release"

[durable_objects]
bindings = [
  { name = "LL_HLS_DO", class_name = "LlHlsDO" },
  { name = "SIMPLE_DO", class_name = "SimpleDO" },
]

[[migrations]]
tag = "v1"
new_classes = ["LlHlsDO", "SimpleDO"]

# Secrets: set via `wrangler secret put`
#   ORIGIN_SECRET   - shared secret forwarded as origin_secret query param to node /internal/hls-ws
#   JWT_SECRET      - shared secret used to verify HS256 viewer JWTs

[vars]
# Default deployment keeps playback JWT verification enabled.
PLAYBACK_AUTH_MODE = "required"
# Max concurrent blocking HTTP waiters per DO shard before returning 503 (overflow to next shard).
MAX_WAITERS_PER_SHARD = "500"
# Total shard slots available per stream per PoP. hash(IP) % MAX_SHARDS determines starting shard.
# Set to ceil(max_expected_viewers / 400) for headroom. 250 supports ~100K viewers.
MAX_SHARDS = "250"
